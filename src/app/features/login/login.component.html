<div class="login-container">
  <!-- Fondo con efecto de grid -->
  <div class="bg-animation">
    <div class="grid"></div>
  </div>

  <!-- Tarjeta de login -->
  <div class="login-card">
    <div class="card-inner">
      <!-- Logo y título -->
      <div class="brand">
        <div class="brand-logo">
          <svg
            width="42"
            height="42"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 2L2 7L12 12L22 7L12 2Z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M2 17L12 22L22 17"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M2 12L12 17L22 12"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 12V7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <h1>Kardex<span>Digital</span></h1>
        <p class="slogan">Gestión Académica</p>
      </div>

      <!-- Debug SQL (para práctica) -->
      <div class="debug-panel" *ngIf="lastQuery">
        <div class="debug-header">
          <span class="debug-dot"></span>
          <span>Última consulta SQL</span>
        </div>
        <code>{{ lastQuery }}</code>
      </div>

      <!-- Formulario -->
      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="input-field">
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            placeholder=" "
            autocomplete="off"
            required
          />
          <label for="username">Usuario</label>
          <div class="field-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
        </div>

        <div class="input-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder=" "
            required
          />
          <label for="password">Contraseña</label>
          <div class="field-icon" (click)="showPassword = !showPassword">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </div>
        </div>

        <button type="submit" class="btn-login" [disabled]="loading">
          <span *ngIf="!loading">Acceder</span>
          <span *ngIf="loading" class="btn-spinner"></span>
          <span *ngIf="loading">Accediendo...</span>
        </button>

        <div class="payload-row">
          <button
            type="button"
            class="payload-link"
            (click)="setPayload('admin\' OR \'1\'=\'1')"
          >
            🧪 SQLi: admin' OR '1'='1
          </button>
          <button
            type="button"
            class="payload-link"
            (click)="setPayload('admin\' --')"
          >
            🧪 SQLi: admin' --
          </button>
        </div>
      </form>

      <!-- Footer minimal -->
      <div class="login-footer">
        <p>© 2024 Kardex Digital</p>
      </div>
    </div>
  </div>

  <!-- Toast de error -->
  <div *ngIf="errorMessage" class="error-toast">
    <span>{{ errorMessage }}</span>
    <button (click)="errorMessage = ''">×</button>
  </div>
</div>
